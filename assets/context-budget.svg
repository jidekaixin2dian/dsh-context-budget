<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Context budget: hide heavy MCP and Skill schemas">
  <rect width="960" height="360" fill="#0b1220"/>
  <text x="48" y="62" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600">Context budget</text>
  <text x="48" y="94" fill="#8fa1b8" font-family="Segoe UI, sans-serif" font-size="15">same MCP servers, fewer schemas in the prompt</text>

  <rect x="48" y="132" width="250" height="150" rx="14" fill="#111a2b" stroke="#26344a"/>
  <text x="72" y="170" fill="#8fa1b8" font-family="Segoe UI, sans-serif" font-size="13">WITHOUT BUDGET</text>
  <text x="72" y="212" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600">267 tools</text>
  <text x="72" y="246" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="15">~211K schema tokens</text>
  <rect x="72" y="260" width="180" height="6" rx="3" fill="#f87171" opacity=".75"/>

  <path d="M330 207h80" stroke="#38bdf8" stroke-width="2"/>
  <path d="M410 207l-10-6M410 207l-10 6" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="338" y="192" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="13">hide groups</text>

  <rect x="448" y="132" width="250" height="150" rx="14" fill="#111a2b" stroke="#38bdf8"/>
  <text x="472" y="170" fill="#8fa1b8" font-family="Segoe UI, sans-serif" font-size="13">WITH BUDGET</text>
  <text x="472" y="212" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600">60 tools</text>
  <text x="472" y="246" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="15">~15K schema tokens</text>
  <rect x="472" y="260" width="54" height="6" rx="3" fill="#4ade80" opacity=".85"/>

  <rect x="738" y="132" width="174" height="150" rx="14" fill="#111a2b" stroke="#26344a"/>
  <text x="762" y="170" fill="#8fa1b8" font-family="Segoe UI, sans-serif" font-size="13">RESTORE</text>
  <text x="762" y="204" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15">no config edit</text>
  <text x="762" y="230" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15">no restart</text>
  <text x="762" y="256" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15">MCP stays alive</text>
</svg>
